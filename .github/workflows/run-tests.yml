name: run tests

on:
  workflow_call:
    inputs:
      label:
        description: label for test runner
        type: string
        required: true
      python:
        description: python version to use
        type: string
        required: true
      timeout:
        description: timeout (minutes)
        type: string
        required: true
      locality:
        description: source install
        type: boolean
        required: true

jobs:
  Run-Tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Log inputs
        run: |-
          echo "inputs.label=${{ inputs.label }}"
          echo "inputs.python=${{ inputs.python }}"
          echo "inputs.timeout=${{ inputs.timeout }}"
        shell: bash

      - name: boolean comp
        if: ${{ inputs.locality == true }}
        run: echo "hello, world!"

      - name: string comp
        if: ${{ inputs.locality == 'true' }}
        run: echo "hello, world!"
