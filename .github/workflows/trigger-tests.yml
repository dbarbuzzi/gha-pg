name: Trigger tests

on:
  push:
  workflow_dispatch:

jobs:
  Run-Nightly-Tests:
    name: Run Nightly Tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: 3.9
            label: k8s-h100-solo
            timeout: 150
          - python: 3.12
            label: k8s-a100-duo
            timeout: 180
    uses: ./.github/workflows/run-tests.yml
    with:
      label: ${{ matrix.label }}
      python: ${{ matrix.python }}
      timeout: ${{ matrix.timeout }}

  Run-Weekly-Tests:
    name: Run Weekly Tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: 3.9
            label: k8s-h100-solo
            timeout: 150
          - python: 3.10
            label: k8s-a100-quad
            timeout: 180
          - python: 3.11
            label: k8s-h100-duo
            timeout: 150
          - python: 3.12
            label: k8s-a100-duo
            timeout: 180

    uses: ./.github/workflows/run-tests.yml
    with:
      label: ${{ matrix.label }}
      python: ${{ matrix.python }}
      timeout: ${{ matrix.timeout }}
