name: parent

on:
  workflow_call:
    inputs:
      parent_runner:
        type: string
        required: true
      parent_label:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      parent_runner:
        type: string
        required: true
      parent_label:
        type: string
        required: true

jobs:
  PARENT-MAIN:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: parent - show "github"
        env:
          TARGET: ${{ toJson(github) }}
        run: echo -e "${TARGET}"

      - name: parent - show "env"
        env:
          TARGET: ${{ toJson(env) }}
        run: echo -e "${TARGET}"

      - name: parent - show "input"
        env:
          TARGET: ${{ toJson(inputs) }}
        run: echo -e "${TARGET}"

      - name: Show retrigger command
        uses: ./.github/actions/show-retrigger-command
        with:
          workflow-inputs: ${{ toJson(inputs) }}

  PARENT-SPAWN:
    uses: ./.github/workflows/child.yml
    with:
      child_runner: really-fast
      child_label: bolt
