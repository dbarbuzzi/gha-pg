name: child

on:
  workflow_call:
    inputs:
      child_runner:
        type: string
        required: true
      child_label:
        type: string
        required: false
      common:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      child_runner:
        type: string
        required: true
      child_label:
        type: string
        required: false
      common:
        type: string
        required: true

jobs:
  CHILD-MAIN:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v9.0.0

      - name: parent - show "github"
        env:
          TARGET: ${{ toJson(github) }}
        run: echo -e "${TARGET}"

      - name: parent - show "env"
        run: env | sort

      - name: parent - show "inputs"
        env:
          TARGET: ${{ toJson(inputs) }}
        run: echo -e "${TARGET}"

      - name: Show retrigger command
        uses: ./.github/actions/show-retrigger-command
        with:
          workflow-file: child.yml
          workflow-inputs: ${{ toJson(inputs) }}
